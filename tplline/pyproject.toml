[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tplline"]

[project]
name = "TPLline"
version = "0.1.0"
description = "Simple template engine for generating text from templates."
authors = [{name = "Diego Brondo", email = "jamesbrond@gmail.com"}]
maintainers = [{name = "Diego Brondo", email = "jamesbrond@gmail.com"}]
requires-python = ">=3.14"
license = {text = "MIT"}
dependencies = [

]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3.14"
]
# [project.urls]
# Homepage = "https://example.com"
# Documentation = "https://readthedocs.org"
# Repository = "https://github.com/me/spam.git"
# "Bug Tracker" = "https://github.com/me/spam/issues"
# Changelog = "https://github.com/me/spam/blob/master/CHANGELOG.md"


# Development Dependencies with Inheritance
[project.optional-dependencies]
# Install with: pip install -e .[dev]
dev = [
    "build>=1.5.1"
]
# Install with: pip install -e .[test]
test = [
    "pytest>=9.1.1",
    "coverage>=7.15.0",
    "PyYAML==6.0.3"
]
# Install with: pip install -e .[lint]
lint = [
    "flake8>=7.3.0",
    "pylint>=4.0.6"
]

[tool.pytest.ini_options]
testpaths = ["tests", "src"]

[tool.pylint]
format.max-line-length = 120
